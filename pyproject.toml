# ============================
# Warning: Python version must be consistant between:
#   - project.requires-python
#   - tool.ruff.target-version
#   - tool.pyright.pythonVersion
#
# Warning: Package name must be consistant between:
#   - project.scripts
#   - tool.ruff.lint.isort.known-first-party
#   - The folder inside 'src/'
# ============================
[project]
name = "python-study"
version = "0.0.1"
description = "python-study"
readme = "README.md"
license = "MIT"
authors = [{ name = "gaaiuss", email = "caio.gui.castro@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["python-dotenv>=1.1.0"]

[project.urls]
Repository = "https://github.com/gaaiuss/python-study"

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest", "pytest-xdist"]


# ============================
# Linting and auto format (Ruff)
# ============================
[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "A",
    "ANN",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FIX",
    "I",
    "ICN",
    "ISC",
    "Q",
    "RET",
    "RSE",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TRY",
    "UP",
    "W",
    "YTT",
    "RUF",
    "N",
]
ignore = ["T201", "COM812", 'ERA001']

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ============================
# Typing (Pyright)
# ============================
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", 'tests']
exclude = [
    "**/.*",
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__", 
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

# ============================
# Tests (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
# Add 'src' to Python path during tests. This allows the tests in `tests/` 
# to import the modules in `src/` without errors.
pythonpath = ["src"]
testpaths = ["tests"]

# ============================
# Build and Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Informs setuptools to find the packages inside 'src' folder.
# Essential for layout structure 'src/'.
where = ["src"]

[tool.setuptools]
# Maps the root folder to 'src'.
package-dir = { "" = "src" }
